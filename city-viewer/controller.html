<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Strand Controller</title>
<style>
  /* Phone controller: hold the phone sideways (landscape).
     Left = steering pad (drag left/right). Right = GAS / BRAKE / HANDBRAKE / E. */
  :root { --bg:#05070d; --panel:#111827; --line:#2a3550; --orange:#ff8c1a; --blue:#3a8bff; --text:#eef2fa; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; overflow:hidden; touch-action:none; }
  #pad { position:fixed; inset:0; display:grid; grid-template-columns:1.2fr 1fr; gap:12px; padding:12px; }
  .zone { background:var(--panel); border:1px solid var(--line); border-radius:18px; position:relative; }
  #steer { display:flex; align-items:center; justify-content:center; }
  #steer .track { position:absolute; left:10%; right:10%; top:50%; height:6px; margin-top:-3px; background:var(--line); border-radius:3px; }
  #knob { position:absolute; top:50%; left:50%; width:84px; height:84px; margin:-42px 0 0 -42px; border-radius:50%;
          background:var(--orange); display:grid; place-items:center; padding:8px; font-weight:900; color:var(--bg); font-size:15px; }
  #steer .hint { position:absolute; bottom:12px; width:100%; text-align:center; color:#8e9ab5; font-size:13px; }
  #buttons { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:2fr 1fr 1fr; gap:12px; background:none; border:none; }
  .btn { border-radius:18px; border:1px solid var(--line); background:var(--panel); display:grid; place-items:center; padding:10px 12px; text-align:center;
         font-weight:900; font-size:22px; letter-spacing:.06em; color:var(--text); }
  .btn.down { filter:brightness(1.7); transform:scale(.97); }
  #gas { background:#1f6b3a; grid-row:1; grid-column:2; }
  #brake { background:#7a1f22; grid-row:1; grid-column:1; }
  #hand { font-size:16px; }
  #throw { grid-column:1 / span 2; background:#ff8c1a; color:var(--bg); font-size:18px; }
  #act { background:var(--blue); color:var(--bg); font-size:16px; }
  #scan-prompt { position:fixed; inset:0; z-index:4; display:none; place-items:center; overflow-y:auto; background:rgba(5,7,13,.88); text-align:center; padding:20px; }
  #scan-prompt h2 { margin:0 0 6px; font-size:26px; font-weight:900; }
  #scan-prompt p { margin:0 0 16px; color:#c9d3e6; }
  #scan-prompt button { margin:6px; padding:14px 26px; border:none; border-radius:12px; font-size:18px; font-weight:900; }
  #prompt-scan { background:#ffd23f; color:var(--bg); }
  #prompt-later { background:var(--panel); color:var(--text); border:1px solid var(--line) !important; }
  #scan-prompt .backup-title { margin:18px 0 6px; font-size:14px; }
  #scan-prompt .backups button { margin:4px; padding:8px 12px; font-size:28px; background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  #scan-preview { position:fixed; inset:0; z-index:5; display:none; place-items:center; background:rgba(5,7,13,.92); text-align:center; padding:16px; }
  #scan-preview h2 { margin:0 0 8px; font-size:22px; font-weight:900; }
  #scan-preview .preview-box { margin:0 auto 12px; padding:12px; border-radius:14px; background:#3a8bff; display:inline-block; }
  #scan-preview canvas { display:block; max-height:45vh; max-width:70vw; }
  #scan-preview button { margin:6px; padding:12px 24px; border:none; border-radius:12px; font-size:18px; font-weight:900; }
  #preview-equip { background:#7dff9a; color:var(--bg); }
  #preview-retake { background:var(--panel); color:var(--text); border:1px solid var(--line) !important; }
  #scan { position:fixed; top:8px; right:12px; z-index:3; padding:8px 14px; border-radius:12px; border:none;
          background:#ffd23f; color:var(--bg); font-weight:900; font-size:15px; }
  #msg { position:fixed; left:50%; top:46px; transform:translateX(-50%); z-index:3; display:none; width:min(92vw,620px); padding:10px 14px;
         border-radius:12px; background:#eaf3ff; color:#05070d; font-weight:800; font-size:17px; line-height:1.3; text-align:center; pointer-events:none; }
  /* 1997 pager look: green LCD screen */
  body.pager #msg { background:#a8c66c; color:#1c2b10; border:5px solid #3a4a2a; font-family:"Courier New",monospace; letter-spacing:.04em; }
  body.pager { background:#141a10; }
  #status { position:fixed; top:6px; left:50%; transform:translateX(-50%); font-size:12px; color:#8e9ab5; pointer-events:none; }
  #start { position:fixed; inset:0; background:var(--bg); display:grid; place-items:center; text-align:center; padding:24px; z-index:5; }
  #start h1 { margin:0 0 8px; font-style:italic; font-weight:900; letter-spacing:.06em; }
  #start h1 span { color:var(--orange); }
  #start p { color:#8e9ab5; margin:6px 0; }
  #start button { margin-top:14px; padding:14px 30px; font-size:20px; font-weight:900; border:none; border-radius:12px; background:var(--orange); color:var(--bg); }
  @media (orientation: portrait) { #pad { grid-template-columns:1fr; grid-template-rows:1fr 1.1fr; } }
</style>
</head>
<body>
<div id="start">
  <div>
    <h1><span>STRAND</span> CONTROLLER</h1>
    <p>Turn your phone sideways.</p>
    <p id="hapticNote"></p>
    <button id="go" type="button">TAP TO DRIVE</button>
  </div>
</div>
<div id="status">connecting…</div>
<div id="msg"></div>
<!-- Scan an item: opens the phone camera (a normal photo, works without HTTPS) -->
<button id="scan" type="button">📷 SCAN ITEM</button>
<div id="scan-prompt">
  <div>
    <h2>📷 Scan something to use as a weapon!</h2>
    <p>Put any object (a can, a pen, a mug) on a plain sheet of paper and fill the photo with it.</p>
    <button id="prompt-scan" type="button">SCAN NOW</button>
    <button id="prompt-later" type="button">Later</button>
    <p class="backup-title">No camera? Pick one:</p>
    <div class="backups">
      <button type="button" data-emoji="☕">☕</button><button type="button" data-emoji="🥖">🥖</button>
      <button type="button" data-emoji="☂️">☂️</button><button type="button" data-emoji="🎸">🎸</button>
      <button type="button" data-emoji="🫖">🫖</button><button type="button" data-emoji="🥫">🥫</button>
    </div>
  </div>
</div>
<!-- Preview of the cut-out: the judge checks it before it goes into the game -->
<div id="scan-preview">
  <div>
    <h2>Your weapon</h2>
    <div class="preview-box"></div>
    <button id="preview-equip" type="button">EQUIP ✓</button>
    <button id="preview-retake" type="button">RETAKE</button>
  </div>
</div>
<input id="photo" type="file" accept="image/*" capture="environment" hidden>
<script type="module">
  // The cut-out maker is shared with the game (game/cutout.js) - the phone runs it for the preview.
  import { makeCutout, emojiCutout } from '/game/cutout.js';
  window.cutout = { makeCutout, emojiCutout };
</script>
<div id="pad">
  <div class="zone" id="steer"><div class="track"></div><div id="knob">STEER</div><div class="hint">drag left / right</div></div>
  <div class="zone" id="buttons">
    <div class="btn" id="brake">BRAKE</div>
    <div class="btn" id="gas">GAS</div>
    <div class="btn" id="hand">HANDBRAKE</div>
    <div class="btn" id="act">E · CAR / BOX</div>
    <div class="btn" id="throw">💥 THROW WEAPON</div>
  </div>
</div>
<script>
// ---- Haptics: navigator.vibrate works on Android (Chrome). iPhones don't support it. ----
const canVibrate = 'vibrate' in navigator;
const buzz = (pattern) => { if (canVibrate) navigator.vibrate(pattern); };
document.getElementById('hapticNote').textContent = canVibrate ? 'Haptic feedback: on' : 'Haptic feedback is not supported on this phone (works on Android).';

// ---- Current controls ----
const state = { throttle: 0, brake: 0, steer: 0, handbrake: false };
let lastSent = '';
function sendInput(extra) {
  const msg = JSON.stringify(extra ? { ...state, ...extra } : state);
  if (!extra && msg === lastSent) return; // nothing changed
  lastSent = msg;
  fetch('/api/input', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: msg }).catch(() => {});
}
setInterval(() => { lastSent = ''; sendInput(); }, 250); // heartbeat so the game knows we're still here

// ---- Buttons (pointer events = works with several fingers at once) ----
function holdButton(id, onChange) {
  const el = document.getElementById(id);
  const set = (down) => { el.classList.toggle('down', down); onChange(down); sendInput(); };
  el.addEventListener('pointerdown', (e) => { el.setPointerCapture(e.pointerId); buzz(12); set(true); });
  el.addEventListener('pointerup', () => set(false));
  el.addEventListener('pointercancel', () => set(false));
}
holdButton('gas', (d) => { state.throttle = d ? 1 : 0; });
holdButton('brake', (d) => { state.brake = d ? 1 : 0; });
holdButton('hand', (d) => { state.handbrake = d; });
const act = document.getElementById('act');
act.addEventListener('pointerdown', () => { act.classList.add('down'); buzz(20); sendInput({ action: Date.now() }); });
act.addEventListener('pointerup', () => act.classList.remove('down'));
const thr = document.getElementById('throw');
thr.addEventListener('pointerdown', () => { thr.classList.add('down'); buzz([30, 20, 60]); sendInput({ throw: Date.now() }); });
thr.addEventListener('pointerup', () => thr.classList.remove('down'));

// ---- Steering pad: finger position left/right = steer -1..1 ----
const pad = document.getElementById('steer'), knob = document.getElementById('knob');
let steerId = null;
function steerFrom(e) {
  const r = pad.getBoundingClientRect();
  const x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2.4));
  state.steer = -x; // game: +1 = left
  knob.style.left = `${50 + x * 40}%`;
  sendInput();
}
pad.addEventListener('pointerdown', (e) => { steerId = e.pointerId; pad.setPointerCapture(e.pointerId); steerFrom(e); });
pad.addEventListener('pointermove', (e) => { if (e.pointerId === steerId) steerFrom(e); });
const release = () => { steerId = null; state.steer = 0; knob.style.left = '50%'; sendInput(); };
pad.addEventListener('pointerup', release);
pad.addEventListener('pointercancel', release);

// ---- Messages from the game: vibrate on crashes, missions, police, warp ----
const status = document.getElementById('status');
const events = new EventSource('/api/events?role=phone');
events.onopen = () => { status.textContent = 'connected ✓'; };
events.onerror = () => { status.textContent = 'reconnecting…'; };
events.addEventListener('haptic', (e) => { const d = JSON.parse(e.data); buzz(d.pattern); });
// Snowflake Dispatch instructions shown big on the phone (where to go next).
const msg = document.getElementById('msg');
let msgTimer;
events.addEventListener('message', (e) => {
  const d = JSON.parse(e.data);
  msg.textContent = d.text;
  document.body.classList.toggle('pager', !!d.pager); // 1997: the controller turns into a pager
  msg.style.display = 'block';
  buzz([40, 40, 40]);
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { msg.style.display = 'none'; }, 9000);
});

// ---- Scan an item: take a photo, shrink it, send it to the game ----
const photo = document.getElementById('photo');
const scanPrompt = document.getElementById('scan-prompt');
document.getElementById('scan').addEventListener('click', () => photo.click());
document.getElementById('prompt-scan').addEventListener('click', () => { scanPrompt.style.display = 'none'; photo.click(); });
document.getElementById('prompt-later').addEventListener('click', () => { scanPrompt.style.display = 'none'; });
// Photo -> cut-out ON THE PHONE -> preview (EQUIP / RETAKE) -> send the finished cut-out.
const preview = document.getElementById('scan-preview');
let pending = null; // the cut-out waiting for EQUIP
function showPreview(canvas) {
  pending = canvas;
  const box = preview.querySelector('.preview-box');
  box.innerHTML = '';
  box.appendChild(canvas);
  scanPrompt.style.display = 'none';
  preview.style.display = 'grid';
}
photo.addEventListener('change', async () => {
  const file = photo.files[0];
  if (!file) return;
  status.textContent = 'cutting out…';
  try {
    showPreview(await window.cutout.makeCutout(await createImageBitmap(file)));
    status.textContent = 'check your weapon';
  } catch {
    status.textContent = 'scan failed - try again';
  }
  photo.value = ''; // so the same photo can be picked again
});
document.querySelectorAll('.backups button').forEach((b) =>
  b.addEventListener('click', () => showPreview(window.cutout.emojiCutout(b.dataset.emoji))));
document.getElementById('preview-retake').addEventListener('click', () => { preview.style.display = 'none'; photo.click(); });
document.getElementById('preview-equip').addEventListener('click', async () => {
  preview.style.display = 'none';
  status.textContent = 'sending weapon…';
  try {
    await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: pending.toDataURL('image/png'), cut: true }) });
    status.textContent = 'weapon equipped ✓';
    buzz([40, 60, 40, 60, 120]);
  } catch {
    status.textContent = 'send failed - try again';
  }
});

// ---- Start: a tap is needed before phones allow vibration/fullscreen ----
document.getElementById('go').addEventListener('click', async () => {
  buzz([30, 40, 30]);
  document.getElementById('start').remove();
  scanPrompt.style.display = 'grid'; // "Scan something to use as a weapon!"
  try { await document.documentElement.requestFullscreen(); await screen.orientation.lock('landscape'); } catch { /* not supported - fine */ }
});
</script>
</body>
</html>
